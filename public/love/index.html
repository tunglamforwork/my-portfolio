<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080006; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }

    .hint {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, serif; font-size: 11px;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(248, 200, 210, 0.42);
      white-space: nowrap; cursor: default;
      opacity: 0; animation: hintLife 8s 1.5s ease-in-out forwards;
      transition: opacity 0.35s ease, color 0.35s ease;
    }
    .hint:hover {
      opacity: 1 !important;
      color: rgba(248, 200, 210, 0.80);
    }
    @keyframes hintLife {
      0%      { opacity: 0; }
      10%, 75% { opacity: 1; }
      100%    { opacity: 0.28; }
    }

    .quote-overlay {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity 0.6s ease;
      z-index: 10; width: 90%; max-width: 560px;
    }
    .quote-overlay.visible { opacity: 1; }
    .quote-inner {
      display: inline-block;
      padding: 28px 36px;
      background: radial-gradient(ellipse at center, rgba(80,10,30,0.72) 0%, rgba(20,4,12,0.55) 100%);
      border: 1px solid rgba(230, 57, 70, 0.22);
      border-radius: 4px;
      backdrop-filter: blur(6px);
    }
    .quote-text {
      font-family: Georgia, serif; font-size: 1.25rem;
      color: rgba(255, 218, 224, 0.96);
      text-shadow: 0 0 18px rgba(230, 57, 70, 0.7), 0 0 40px rgba(230, 57, 70, 0.3);
      line-height: 1.65; letter-spacing: 0.04em;
    }
    .quote-author {
      font-family: Georgia, serif; font-size: 0.78rem;
      color: rgba(248, 200, 210, 0.58);
      letter-spacing: 0.22em; text-transform: uppercase;
      margin-top: 14px;
    }

    .love-counter {
      position: fixed; top: 20px; right: 22px;
      font-family: Georgia, serif; font-size: 11px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(248, 200, 210, 0.38);
      pointer-events: none;
      transition: color 0.4s ease, opacity 0.4s ease;
      opacity: 0;
    }
    .love-counter.visible { opacity: 1; }
    .love-counter.pulse { color: rgba(248, 160, 180, 0.85); }

    .rank-label {
      font-size: 0.60rem; letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(212, 175, 55, 0);
      margin-top: 3px; text-align: right;
      transition: color 0.6s ease;
    }
    .rank-label.show  { color: rgba(212, 175, 55, 0.58); }
    .rank-label.flash { color: rgba(255, 215, 0, 0.95); }

    .combo-display {
      position: fixed; top: 52px; right: 22px;
      font-family: Georgia, serif; text-align: right;
      pointer-events: none;
      opacity: 0; transition: opacity 0.22s ease;
    }
    .combo-display.visible { opacity: 1; }
    .combo-number {
      font-size: 2rem; line-height: 1;
      color: rgba(255, 175, 130, 0.96);
      text-shadow: 0 0 22px rgba(255, 80, 40, 0.85);
      letter-spacing: 0.04em;
      display: inline-block;
      transition: transform 0.22s ease-out;
    }
    .combo-number.mega {
      color: rgba(255, 218, 0, 0.98);
      text-shadow: 0 0 28px rgba(255, 200, 0, 1), 0 0 56px rgba(255, 140, 0, 0.5);
    }
    .combo-label {
      font-size: 0.58rem; letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(248, 200, 210, 0.48);
      margin-top: 2px;
    }

    .special-hint {
      position: fixed; bottom: 54px; left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, serif; font-size: 10px;
      letter-spacing: 0.34em; text-transform: uppercase;
      color: rgba(255, 215, 0, 0); pointer-events: none;
      white-space: nowrap; transition: color 1.4s ease;
    }
    .special-hint.visible { color: rgba(255, 210, 60, 0.62); }

    .level-flash {
      position: fixed; top: 44%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: Georgia, serif; font-size: 0.88rem;
      letter-spacing: 0.34em; text-transform: uppercase;
      pointer-events: none; white-space: nowrap; z-index: 20;
      opacity: 0;
    }
    .level-flash.pop { animation: levelPop 2.4s ease-out forwards; }
    @keyframes levelPop {
      0%   { opacity:0; transform:translate(-50%,-50%) scale(0.75); color:rgba(255,215,0,0.95); }
      18%  { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
      55%  { opacity:1; transform:translate(-50%,-50%) scale(1);    }
      100% { opacity:0; transform:translate(-50%,-50%) scale(1);    color:rgba(255,215,0,0.95); }
    }

    .combo-msg {
      position: fixed; top: 100px; right: 22px;
      font-family: Georgia, serif; font-size: 0.70rem;
      letter-spacing: 0.28em; text-transform: uppercase;
      pointer-events: none; text-align: right; opacity: 0;
    }
    .combo-msg.pop { animation: comboMsgPop 1.8s ease-out forwards; }
    @keyframes comboMsgPop {
      0%   { opacity:0; color:rgba(255,200,120,0.95); transform:translateY(5px); }
      20%  { opacity:1; transform:translateY(0); }
      65%  { opacity:1; }
      100% { opacity:0; }
    }
    .combo-msg.star-pop { animation: comboMsgPop 2.2s ease-out forwards; color: rgba(200,230,255,0.95); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="hint">Drag · Scroll to zoom · Click a heart · Pop hearts to unlock themes · ✦ Find the golden heart · ★ Catch a shooting star</p>
  <div class="love-counter" id="loveCounter">
    <span id="loveCount">0</span> hearts loved
    <div class="rank-label" id="rankLabel"></div>
  </div>
  <div class="combo-display" id="comboDisplay">
    <div class="combo-number" id="comboNumber">×2</div>
    <div class="combo-label">Combo</div>
  </div>
  <p class="special-hint" id="specialHint">✦ A golden heart awaits · click it!</p>
  <div class="level-flash" id="levelFlash"></div>
  <div class="combo-msg"   id="comboMsg"></div>
  <div class="quote-overlay" id="quoteOverlay">
    <div class="quote-inner">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-author" id="quoteAuthor"></p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ── RENDERER ────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // ── SCENE ────────────────────────────────────────────────
    const scene = new THREE.Scene();

    // Radial gradient background (canvas texture)
    {
      const bc = document.createElement('canvas');
      bc.width = bc.height = 1024;
      const bctx = bc.getContext('2d');
      const g = bctx.createRadialGradient(512,512,0, 512,512,720);
      g.addColorStop(0.0, '#300c1e');
      g.addColorStop(0.3, '#1d0612');
      g.addColorStop(0.7, '#12040a');
      g.addColorStop(1.0, '#070005');
      bctx.fillStyle = g;
      bctx.fillRect(0,0,1024,1024);
      scene.background = new THREE.CanvasTexture(bc);
    }
    scene.fog = new THREE.FogExp2(0x0a0208, 0.028);

    // ── CAMERA (spherical controller) ───────────────────────
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
    const sph = new THREE.Spherical(11, Math.PI / 2, 0);
    let autoTheta = 0;
    let phiOffset   = 0;   // user phi deviation — decays smoothly back to center
    let thetaInertia = 0;  // spin momentum from drag release

    function applyCamera() {
      camera.position.setFromSpherical(sph);
      camera.lookAt(0, 0, 0);
    }
    applyCamera();

    // ── ENVIRONMENT MAP ─────────────────────────────────────
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment()).texture;
    pmrem.dispose();

    // ── POST-PROCESSING ─────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.3, 0.50, 0.70
    );
    composer.addPass(bloom);
    composer.addPass(new OutputPass());
    let bloomTarget = 1.3;

    // ── HEART GEOMETRY ──────────────────────────────────────
    function makeHeartGeo(depth = 0.28, bevel = 0.042) {
      const shape = new THREE.Shape();
      shape.moveTo( 0,     0.28);
      shape.bezierCurveTo( 0.08,  0.62,  0.52,  0.54,  0.52,  0.10);
      shape.bezierCurveTo( 0.52, -0.18,  0.20, -0.45,  0,    -0.58);
      shape.bezierCurveTo(-0.20, -0.45, -0.52, -0.18, -0.52,  0.10);
      shape.bezierCurveTo(-0.52,  0.54, -0.08,  0.62,  0,     0.28);

      const geo = new THREE.ExtrudeGeometry(shape, {
        depth, bevelEnabled: true,
        bevelSegments: 10, bevelSize: bevel, bevelThickness: bevel,
        steps: 2, curveSegments: 30,
      });
      geo.computeBoundingBox();
      const c = new THREE.Vector3();
      geo.boundingBox.getCenter(c);
      geo.translate(-c.x, -c.y, -c.z);
      return geo;
    }

    const GEO_MAIN  = makeHeartGeo(0.28, 0.042);
    const GEO_MED   = makeHeartGeo(0.24, 0.036);
    const GEO_SMALL = makeHeartGeo(0.22, 0.030);

    // ── MATERIALS & THEMES ──────────────────────────────────
    function phys(col, emi, eiInt, metal, rough, extra = {}) {
      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(col), emissive: new THREE.Color(emi),
        emissiveIntensity: eiInt, metalness: metal, roughness: rough,
        clearcoat: 0.9, clearcoatRoughness: 0.08, envMapIntensity: 1.4,
        ...extra,
      });
    }

    const THEMES = [
      { name: 'Rose Gold',      main: [0xC84060, 0xE63946], orbs: [[0xE63946,0xE63946],[0xB8880E,0xD4AF37],[0xF8D7DA,0xF8D7DA],[0xD8C4F1,0xD8C4F1],[0xa02040,0xff4060]] },
      { name: 'Ice Sapphire',   main: [0x3058C0, 0x4060E8], orbs: [[0x4060E8,0x6080ff],[0x20A8D0,0x20c8ff],[0xC0D8F8,0xC0D8F8],[0x9080F0,0xb0a0ff],[0x2040A0,0x5070ff]] },
      { name: 'Champagne',      main: [0xC0880A, 0xD4A020], orbs: [[0xD4A020,0xD4AF37],[0xE07050,0xff8060],[0xFFF0C8,0xFFF0C8],[0xE0B880,0xE0C898],[0x986010,0xC09030]] },
      { name: 'Amethyst',       main: [0x7830C0, 0xA050E8], orbs: [[0xD8C4F1,0xe0d0ff],[0xC060E0,0xe080ff],[0xffc8e8,0xffc8e8],[0x6040C0,0xa060ff],[0x501080,0x9040E0]] },
    ];
    let themeIndex = 0;

    const LEVEL_THRESHOLDS = [5, 15, 30, 55, 90];

    const MAT_MAIN = phys(0xC84060, 0xE63946, 0.42, 0.82, 0.10);

    const MAT_PALETTE = [
      phys(0xE63946, 0xE63946, 0.55, 0.60, 0.18),
      phys(0xB8880E, 0xD4AF37, 0.48, 0.92, 0.06),
      phys(0xF8D7DA, 0xF8D7DA, 0.28, 0.15, 0.28, { transparent: true, opacity: 0.90 }),
      phys(0xD8C4F1, 0xD8C4F1, 0.36, 0.40, 0.14),
      phys(0xa02040, 0xff4060, 0.60, 0.55, 0.20),
    ];

    const themeMainCol = new THREE.Color(0xC84060);
    const themeMainEmi = new THREE.Color(0xE63946);

    // ── MAIN HEART ──────────────────────────────────────────
    const mainHeart = new THREE.Mesh(GEO_MAIN, MAT_MAIN);
    mainHeart.scale.setScalar(2.4);
    mainHeart.userData.baseScale = 2.4;
    scene.add(mainHeart);

    const glowShell = new THREE.Mesh(GEO_MAIN, new THREE.MeshBasicMaterial({
      color: 0xE63946, transparent: true, opacity: 0.045, side: THREE.BackSide,
    }));
    glowShell.scale.setScalar(2.50);
    scene.add(glowShell);

    // ── ORBIT HEARTS ────────────────────────────────────────
    const ORBIT_CFG = [
      { r:4.3, speed:0.26, sz:1.92, mi:0, yo: 0.4, ph:0.00, ta: 0.25, tax:new THREE.Vector3(1,0,0.3).normalize() },
      { r:5.0, speed:0.19, sz:1.56, mi:1, yo:-0.9, ph:1.05, ta:-0.18, tax:new THREE.Vector3(0.5,0,1).normalize() },
      { r:3.8, speed:0.35, sz:1.32, mi:2, yo: 1.2, ph:2.09, ta: 0.35, tax:new THREE.Vector3(0.2,1,0.5).normalize() },
      { r:5.5, speed:0.16, sz:1.77, mi:3, yo:-0.4, ph:3.14, ta:-0.28, tax:new THREE.Vector3(1,0.3,0).normalize() },
      { r:4.1, speed:0.42, sz:1.15, mi:4, yo: 0.8, ph:4.19, ta: 0.20, tax:new THREE.Vector3(0,1,0.8).normalize() },
      { r:5.8, speed:0.13, sz:2.16, mi:1, yo:-1.2, ph:5.24, ta:-0.40, tax:new THREE.Vector3(0.7,0,0.7).normalize() },
      { r:4.6, speed:0.30, sz:1.25, mi:0, yo: 0.1, ph:0.52, ta: 0.15, tax:new THREE.Vector3(0.3,1,0).normalize() },
      { r:3.5, speed:0.46, sz:1.00, mi:3, yo:-0.6, ph:1.57, ta:-0.32, tax:new THREE.Vector3(1,0.5,0.5).normalize() },
    ];

    const orbitHearts = ORBIT_CFG.map(cfg => {
      const mat = MAT_PALETTE[cfg.mi];
      const m = new THREE.Mesh(GEO_MED, mat);
      m.scale.setScalar(cfg.sz);
      m.userData = {
        ...cfg,
        angle:   cfg.ph,
        baseEI:  mat.emissiveIntensity,
        tCol:    null, tEmi: null,
        orbitCfg: cfg,
      };
      scene.add(m);
      return m;
    });

    // ── FLOAT HEARTS ────────────────────────────────────────
    const FLOAT_COUNT = 22;
    const floatHearts = Array.from({ length: FLOAT_COUNT }, (_, i) => {
      const mat = MAT_PALETTE[i % MAT_PALETTE.length].clone();
      mat.emissiveIntensity += 0.3 + Math.random() * 0.4;
      const m = new THREE.Mesh(GEO_SMALL, mat);

      const θ = Math.random() * Math.PI * 2;
      const φ = Math.acos(2 * Math.random() - 1);
      const r = 3.0 + Math.random() * 6.0;
      const home = new THREE.Vector3(
        r * Math.sin(φ) * Math.cos(θ),
        r * Math.sin(φ) * Math.sin(θ),
        r * Math.cos(φ) - 5
      );
      m.position.copy(home);
      m.scale.setScalar(0.18 + Math.random() * 0.50);
      m.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
      m.userData = {
        home,
        rotY:  (Math.random() - 0.5) * 0.014,
        rotX:  (Math.random() - 0.5) * 0.009,
        phase: Math.random() * Math.PI * 2,
        baseEI: mat.emissiveIntensity,
        tCol: null, tEmi: null,
        floatIdx: i,
      };
      scene.add(m);
      return m;
    });

    // ── PARTICLES ───────────────────────────────────────────
    const N = 5500;
    const pPos = new Float32Array(N * 3), pCol = new Float32Array(N * 3);
    const PCOLS = [0xE63946,0xF8D7DA,0xD4AF37,0xD8C4F1,0xff8fa0,0xffc8a0].map(h => new THREE.Color(h));
    for (let i = 0; i < N; i++) {
      const r = 1.5 + Math.random() * 14;
      const θ = Math.random() * Math.PI * 2;
      const φ = Math.acos(2 * Math.random() - 1);
      pPos[i*3]   = r * Math.sin(φ) * Math.cos(θ);
      pPos[i*3+1] = r * Math.sin(φ) * Math.sin(θ);
      pPos[i*3+2] = r * Math.cos(φ) - 7;
      const c = PCOLS[i % PCOLS.length];
      pCol[i*3] = c.r; pCol[i*3+1] = c.g; pCol[i*3+2] = c.b;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
    const cloud = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.055, vertexColors: true, transparent: true, opacity: 0.72, sizeAttenuation: true,
    }));
    scene.add(cloud);

    // ── LIGHTS ──────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffe0e8, 0.9));
    const DL = [
      { l: new THREE.PointLight(0xff6080, 12, 28), r:5.5, s:0.38, yo: 2.5, ph:0          },
      { l: new THREE.PointLight(0xffc090,  9, 22), r:4.2, s:0.27, yo:-2.0, ph:Math.PI*.5 },
      { l: new THREE.PointLight(0xd4af37,  7, 20), r:3.5, s:0.52, yo: 0.0, ph:Math.PI    },
      { l: new THREE.PointLight(0xe8d0ff,  6, 25), r:6.0, s:0.18, yo: 1.2, ph:Math.PI*1.5},
    ];
    DL.forEach(d => scene.add(d.l));

    // ── BURST POOL ──────────────────────────────────────────
    const burstPool = [];

    // ── CURSOR TRAIL POOL ───────────────────────────────────
    const trailPool = [];
    let trailTick = 0;
    const lastTrailPos = new THREE.Vector3(9999, 9999, 9999);

    function spawnTrailHeart(pos) {
      const mat = MAT_PALETTE[Math.floor(Math.random() * MAT_PALETTE.length)].clone();
      mat.transparent = true;
      mat.emissiveIntensity = 2.2;
      const sc = 0.055 + Math.random() * 0.085;
      const m  = new THREE.Mesh(GEO_SMALL, mat);
      m.scale.setScalar(sc);
      m.position.copy(pos).add(new THREE.Vector3(
        (Math.random() - 0.5) * 0.3,
        (Math.random() - 0.5) * 0.3,
        (Math.random() - 0.5) * 0.4
      ));
      m.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
      m.userData = {
        life:  1.0,
        decay: 0.024 + Math.random() * 0.014,
        vy:    0.007 + Math.random() * 0.011,
        vx:    (Math.random() - 0.5) * 0.005,
        rotY:  (Math.random() - 0.5) * 0.09,
        baseSc: sc,
      };
      trailPool.push(m);
      scene.add(m);
    }

    // ── SHOOTING STAR POOL ──────────────────────────────────
    const starPool  = [];
    let nextStarAt  = 6 + Math.random() * 10;
    const GEO_STAR  = new THREE.OctahedronGeometry(0.22, 0);

    const STAR_QUOTES = [
      { text: "You caught a star. That says everything.", author: "" },
      { text: "The universe is conspiring in your favour.", author: "" },
      { text: "A shooting star, a secret wish — yours has been heard.", author: "" },
      { text: "Some things are worth reaching for.", author: "" },
      { text: "You were born to shine.", author: "" },
    ];

    function spawnStarTrail(pos) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.04 + Math.random() * 0.04, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xFFFFCC, transparent: true, opacity: 0.9 })
      );
      m.position.copy(pos).add(new THREE.Vector3(
        (Math.random() - 0.5) * 0.15,
        (Math.random() - 0.5) * 0.15,
        (Math.random() - 0.5) * 0.2
      ));
      m.userData = { life: 1.0, decay: 0.06 + Math.random() * 0.04, vy: 0.002, isSpark: true };
      trailPool.push(m);
      scene.add(m);
    }

    function spawnShootingStar() {
      const side = Math.random() < 0.5 ? 1 : -1;
      const mat  = new THREE.MeshBasicMaterial({ color: 0xFFFFEE, transparent: true });
      const m    = new THREE.Mesh(GEO_STAR, mat);
      m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
      m.position.set(side * 16, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 2);
      const spd  = 0.20 + Math.random() * 0.14;
      m.userData = {
        vx: -side * spd,
        vy: (Math.random() - 0.5) * 0.014,
        rotZ: (Math.random() - 0.5) * 0.08,
        life: 1.0, decay: 0.004, trailT: 0, isStar: true,
      };
      starPool.push(m);
      scene.add(m);
    }

    function spawnBurst(origin) {
      const ox = origin ? origin.x : 0;
      const oy = origin ? origin.y : 0;
      const oz = origin ? origin.z : 0;
      const n = 10 + Math.floor(Math.random() * 6);
      for (let i = 0; i < n; i++) {
        const mat = MAT_PALETTE[i % MAT_PALETTE.length].clone();
        mat.emissiveIntensity = 2.5;
        mat.transparent = true;
        const m = new THREE.Mesh(GEO_SMALL, mat);
        m.scale.setScalar(0.08 + Math.random() * 0.18);
        m.position.set(
          ox + (Math.random() - 0.5) * 0.7,
          oy + (Math.random() - 0.5) * 0.7,
          oz + (Math.random() - 0.5) * 0.3
        );
        const ang = (i / n) * Math.PI * 2 + Math.random() * 0.7;
        const spd = 0.055 + Math.random() * 0.10;
        m.userData = {
          vx: Math.cos(ang) * spd, vy: 0.06 + Math.random() * 0.10,
          vz: (Math.random() - 0.5) * 0.05, grav: -0.0024,
          life: 1.0, decay: 0.013 + Math.random() * 0.009,
          rotY: (Math.random() - 0.5) * 0.15,
          rotZ: (Math.random() - 0.5) * 0.10,
        };
        burstPool.push(m);
        scene.add(m);
      }
    }

    // ── SHOCKWAVE ───────────────────────────────────────────
    let shockTime = -1000;
    const SHOCK_SPD  = 7.0;
    const SHOCK_STR  = 0.13;
    const SHOCK_DUR  = 0.35;

    function applyShock(pos, t) {
      const dist     = pos.length();
      const localAge = (t - shockTime) - dist / SHOCK_SPD;
      if (localAge > 0 && localAge < SHOCK_DUR) {
        return Math.sin(localAge / SHOCK_DUR * Math.PI) * SHOCK_STR;
      }
      return 0;
    }

    // ── THEME CYCLING ───────────────────────────────────────
    function cycleTheme() {
      themeIndex = (themeIndex + 1) % THEMES.length;
      const th = THEMES[themeIndex];

      themeMainCol.set(th.main[0]);
      themeMainEmi.set(th.main[1]);
      glowShell.material.color.set(th.main[1]);

      orbitHearts.forEach(m => {
        const [c, e] = th.orbs[m.userData.mi];
        m.userData.tCol = new THREE.Color(c);
        m.userData.tEmi = new THREE.Color(e);
      });
      floatHearts.forEach((m, i) => {
        const [c, e] = th.orbs[i % th.orbs.length];
        m.userData.tCol = new THREE.Color(c);
        m.userData.tEmi = new THREE.Color(e);
      });

      bloomTarget = 3.5;
      setTimeout(() => { bloomTarget = 1.3; }, 350);
    }

    // ── QUOTES ──────────────────────────────────────────────
    const QUOTES = [

    const quoteOverlay = document.getElementById('quoteOverlay');
    const quoteTextEl  = document.getElementById('quoteText');
    const quoteAuthEl  = document.getElementById('quoteAuthor');

    const comboMsgEl     = document.getElementById('comboMsg');
    let quoteTimer    = null;
    let lastQuoteIdx  = -1;
    let typeIv        = null;
    let heartsLoved   = 0;

    // ── COMBO SYSTEM ────────────────────────────────────────────
    let combo = 0;
    let comboTimeout = null;
    const COMBO_MS = 1600;
    const COMBO_MILESTONES = [
      { at: 3,  msg: 'Sweet'          },
      { at: 5,  msg: 'On Fire'        },
      { at: 7,  msg: 'Unstoppable'    },
      { at: 10, msg: 'Heart Champion' },
      { at: 15, msg: 'Love Legend'    },
    ];
    let comboMsgTimeout = null;

    function showComboMsg(text, starStyle = false) {
      if (comboMsgTimeout) clearTimeout(comboMsgTimeout);
      comboMsgEl.textContent = text;
      comboMsgEl.className = 'combo-msg';
      void comboMsgEl.offsetWidth;
      comboMsgEl.classList.add(starStyle ? 'star-pop' : 'pop');
      comboMsgTimeout = setTimeout(() => { comboMsgEl.className = 'combo-msg'; }, 2200);
    }

    function registerPop() {
      if (comboTimeout) clearTimeout(comboTimeout);
      combo++;
      if (combo >= 2) {
        comboNumberEl.textContent = `×${combo}`;
        comboNumberEl.classList.toggle('mega', combo >= 6);
        comboDisplayEl.classList.add('visible');
        comboNumberEl.style.transition = 'none';
        comboNumberEl.style.transform = 'scale(1.4)';
        requestAnimationFrame(() => {
          comboNumberEl.style.transition = 'transform 0.28s ease-out';
          comboNumberEl.style.transform  = 'scale(1)';
        });
        const ms = COMBO_MILESTONES.slice().reverse().find(m => combo >= m.at);
        if (ms && combo === ms.at) showComboMsg(ms.msg);
        if (combo >= 7)      { bloomTarget = 5.0; setTimeout(() => { bloomTarget = 1.3; }, 750); }
        else if (combo >= 4) { bloomTarget = 3.8; setTimeout(() => { bloomTarget = 1.3; }, 550); }
        else                 { bloomTarget = 2.8; setTimeout(() => { bloomTarget = 1.3; }, 400); }
      }
      comboTimeout = setTimeout(() => {
        combo = 0;
        comboDisplayEl.classList.remove('visible');
      }, COMBO_MS);
      return combo;
    }

    // ── RANK SYSTEM ─────────────────────────────────────────────
    const RANKS = [
      { min: 1,   label: 'Romantic'     },
      { min: 8,   label: 'Lover'        },
      { min: 20,  label: 'Heartbreaker' },
      { min: 50,  label: 'Love Guru'    },
      { min: 100, label: 'Eternal Love' },
    ];
    let lastRankLabel = '';
    let levelFlashTimeout = null;

    function showLevelFlash(text) {
      if (levelFlashTimeout) clearTimeout(levelFlashTimeout);
      levelFlashEl.textContent = text;
      levelFlashEl.className = 'level-flash';
      void levelFlashEl.offsetWidth;
      levelFlashEl.classList.add('pop');
      levelFlashTimeout = setTimeout(() => { levelFlashEl.className = 'level-flash'; }, 2500);
    }

    function updateRankDisplay() {
      let label = '';
      for (const r of RANKS) { if (heartsLoved >= r.min) label = r.label; else break; }
      rankLabelEl.classList.toggle('show', heartsLoved >= 1);
      if (label !== lastRankLabel) {
        lastRankLabel = label;
        rankLabelEl.textContent = label;
        rankLabelEl.classList.remove('flash');
        void rankLabelEl.offsetWidth;
        rankLabelEl.classList.add('flash');
        setTimeout(() => rankLabelEl.classList.remove('flash'), 900);
      }
    }

    // ── LEVEL-BASED THEME UNLOCK ─────────────────────────────────
    let nextLevelIdx = 0;

    function checkLevelUp() {
      if (nextLevelIdx >= LEVEL_THRESHOLDS.length) return;
      if (heartsLoved >= LEVEL_THRESHOLDS[nextLevelIdx]) {
        nextLevelIdx++;
        cycleTheme();
        const name = THEMES[themeIndex].name;
        showLevelFlash(`✦ ${name} unlocked`);
      }
    }

    // ── SPECIAL GOLDEN HEART ────────────────────────────────────
    let specialMesh      = null;
    let specialGlow      = null;
    let specialSparkles  = [];
    let specialSpawnedAt = -1;
    const SPECIAL_DURATION = 30;
    let nextSpecialAt    = 18 + Math.random() * 18;
    const GOLD_COL = new THREE.Color(0xFFD700);
    const GOLD_EMI = new THREE.Color(0xFFAA00);
    const GEO_SPARK = new THREE.OctahedronGeometry(0.055, 0);

    function markSpecial() {
      if (specialMesh || orbitHearts.length === 0) return;
      const idx  = Math.floor(Math.random() * orbitHearts.length);
      const mesh = orbitHearts[idx];
      if (mesh.userData._popping) return;
      specialMesh = mesh;
      mesh.userData.isSpecial   = true;
      mesh.userData._origMat    = mesh.material;
      const sMat = mesh.material.clone();
      mesh.userData._specialMat = sMat;
      mesh.material = sMat;

      // Outer glow sphere
      specialGlow = new THREE.Mesh(
        new THREE.SphereGeometry(1.1, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xFFCC00, transparent: true, opacity: 0.12, side: THREE.BackSide })
      );
      scene.add(specialGlow);

      // 7 orbiting sparkle octahedra
      for (let i = 0; i < 7; i++) {
        const sm = new THREE.Mesh(GEO_SPARK,
          new THREE.MeshBasicMaterial({ color: 0xFFEE44, transparent: true, opacity: 0.85 })
        );
        sm.userData.sparkIdx = i;
        scene.add(sm);
        specialSparkles.push(sm);
      }

      specialSpawnedAt = clock.getElapsedTime();
      specialHintEl.classList.add('visible');
    }

    function unmarkSpecial(forPop = false) {
      if (!specialMesh) return;
      if (!forPop) {
        // Expiry — restore original material
        specialMesh.material = specialMesh.userData._origMat;
        if (specialMesh.userData._specialMat) {
          specialMesh.userData._specialMat.dispose();
          delete specialMesh.userData._specialMat;
        }
        delete specialMesh.userData._origMat;
      } else {
        // Pop — keep golden mat on mesh so pop animation is golden; dispose it after pop ends
        const matRef = specialMesh.userData._specialMat;
        if (matRef) setTimeout(() => matRef.dispose(), 2200);
        delete specialMesh.userData._specialMat;
        delete specialMesh.userData._origMat;
      }
      specialMesh.userData.isSpecial = false;
      specialMesh = null;
      if (specialGlow) {
        scene.remove(specialGlow);
        specialGlow.material.dispose();
        specialGlow.geometry.dispose();
        specialGlow = null;
      }
      for (const sm of specialSparkles) {
        scene.remove(sm);
        sm.material.dispose();
      }
      specialSparkles = [];
      specialHintEl.classList.remove('visible');
    }

    function popSpecialChain(originPos) {
      const targets = [...orbitHearts, ...floatHearts];
      const nearby  = targets
        .filter(m => m.position.distanceTo(originPos) < 5.2)
        .sort((a, b) => a.position.distanceTo(originPos) - b.position.distanceTo(originPos))
        .slice(0, 5);
      nearby.forEach((m, i) => {
        setTimeout(() => {
          if (orbitHearts.includes(m) || floatHearts.includes(m)) {
            popHeart(m);
            incrementLoveCounter();
            registerPop();
          }
        }, 240 + i * 190);
      });
      bloomTarget = 5.8;
      setTimeout(() => { bloomTarget = 1.3; }, 900);
    }

    function typewrite(el, text, speed, onDone) {
      if (typeIv) clearInterval(typeIv);
      el.textContent = '';
      let i = 0;
      typeIv = setInterval(() => {
        el.textContent += text[i++];
        if (i >= text.length) {
          clearInterval(typeIv);
          typeIv = null;
          if (onDone) onDone();
        }
      }, speed);
    }

    function showQuote(pool = null) {
      const src = pool || QUOTES;
      let idx;
      do { idx = Math.floor(Math.random() * src.length); } while (idx === lastQuoteIdx && src.length > 1);
      lastQuoteIdx = idx;
      const q = src[idx];
      quoteAuthEl.textContent = '';
      quoteOverlay.classList.add('visible');
      if (quoteTimer) clearTimeout(quoteTimer);
      typewrite(quoteTextEl, `”${q.text}”`, 26, () => {
        if (q.author) setTimeout(() => { quoteAuthEl.textContent = `— ${q.author}`; }, 180);
      });
      quoteTimer = setTimeout(() => quoteOverlay.classList.remove('visible'), 4800);
    }

    function incrementLoveCounter(by = 1) {
      heartsLoved += by;
      loveCountEl.textContent = heartsLoved;
      loveCounterEl.classList.add('visible', 'pulse');
      setTimeout(() => loveCounterEl.classList.remove('pulse'), 500);
      updateRankDisplay();
      checkLevelUp();
    }

    // ── POP ANIMATION POOL ──────────────────────────────────
    const poppingPool = [];

    function popHeart(mesh) {
      if (mesh.userData._popping) return;
      mesh.userData._popping = true;

      // Remove from active arrays so it stops updating normally
      const oi = orbitHearts.indexOf(mesh);
      const fi = floatHearts.indexOf(mesh);
      if (oi !== -1) orbitHearts.splice(oi, 1);
      if (fi !== -1) floatHearts.splice(fi, 1);

      // Clone material so the pop fade doesn't affect sibling hearts
      const popMat = mesh.material.clone();
      popMat.transparent = true;
      popMat.emissiveIntensity = 2.8;
      mesh.material = popMat;

      const originPos = mesh.position.clone();
      const originScale = mesh.scale.x;

      poppingPool.push({ mesh, life: 1.0, originScale, originPos });

      // Spawn a denser burst at the heart's world position
      spawnBurst(originPos);

      // Schedule replacement
      const orbitCfg   = mesh.userData.orbitCfg ?? null;
      const floatData   = orbitCfg ? null : { idx: mesh.userData.floatIdx };
      setTimeout(() => {
        if (orbitCfg) {
          spawnOrbitHeart(orbitCfg);
        } else {
          spawnFloatHeart(floatData.idx);
        }
      }, 1600);
    }

    function spawnOrbitHeart(cfg) {
      const mat = MAT_PALETTE[cfg.mi];
      const m = new THREE.Mesh(GEO_MED, mat);
      m.scale.setScalar(cfg.sz);
      m.userData = {
        ...cfg,
        angle:    cfg.ph,
        baseEI:   mat.emissiveIntensity,
        tCol:     null, tEmi: null,
        orbitCfg: cfg,
      };
      scene.add(m);
      orbitHearts.push(m);
    }

    function spawnFloatHeart(idx) {
      const mat = MAT_PALETTE[idx % MAT_PALETTE.length].clone();
      mat.emissiveIntensity += 0.3 + Math.random() * 0.4;
      const m = new THREE.Mesh(GEO_SMALL, mat);
      const θ = Math.random() * Math.PI * 2;
      const φ = Math.acos(2 * Math.random() - 1);
      const r = 3.0 + Math.random() * 6.0;
      const home = new THREE.Vector3(
        r * Math.sin(φ) * Math.cos(θ),
        r * Math.sin(φ) * Math.sin(θ),
        r * Math.cos(φ) - 5
      );
      m.position.copy(home);
      m.scale.setScalar(0.18 + Math.random() * 0.50);
      m.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
      m.userData = {
        home,
        rotY:   (Math.random() - 0.5) * 0.014,
        rotX:   (Math.random() - 0.5) * 0.009,
        phase:  Math.random() * Math.PI * 2,
        baseEI: mat.emissiveIntensity,
        tCol: null, tEmi: null,
        floatIdx: idx,
      };
      scene.add(m);
      floatHearts.push(m);
    }

    // ── RAYCASTER FOR HEART CLICK ────────────────────────────
    const _pickRay = new THREE.Raycaster();
    const _pickMouse = new THREE.Vector2();

    // ── POINTER CONTROLS ────────────────────────────────────
    let mx = 0, my = 0;
    let isDragging = false;
    let dragLast  = { x: 0, y: 0 };
    let dragMoved = false;

    const cursorWorld = new THREE.Vector3();
    const _ray = new THREE.Raycaster();
    const _zPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);

    function refreshCursorWorld() {
      _ray.setFromCamera(new THREE.Vector2(mx, my), camera);
      _ray.ray.intersectPlane(_zPlane, cursorWorld);
    }

    canvas.addEventListener('pointerdown', e => {
      isDragging = true;
      dragMoved  = false;
      dragLast = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', e => {
      mx = (e.clientX / window.innerWidth  - 0.5) *  2;
      my = (e.clientY / window.innerHeight - 0.5) * -2;

      if (isDragging) {
        const dx = (e.clientX - dragLast.x) / window.innerWidth;
        const dy = (e.clientY - dragLast.y) / window.innerHeight;
        if (Math.abs(dx) > 0.002 || Math.abs(dy) > 0.002) dragMoved = true;
        const dtheta = dx * Math.PI * 2.5;
        thetaInertia = -dtheta;
        sph.theta   -= dtheta;
        phiOffset   += dy * Math.PI * 1.5;
        phiOffset    = Math.max(-1.1, Math.min(1.1, phiOffset));
        dragLast     = { x: e.clientX, y: e.clientY };
        autoTheta    = sph.theta;
      }
    });

    canvas.addEventListener('pointerup',     () => { isDragging = false; canvas.classList.remove('dragging'); });
    canvas.addEventListener('pointercancel', () => { isDragging = false; canvas.classList.remove('dragging'); });

    canvas.addEventListener('wheel', e => {
      sph.radius = Math.max(3, Math.min(20, sph.radius + e.deltaY * 0.025));
    }, { passive: true });

    // Pinch-to-zoom for mobile
    let pinchDist = null;
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchDist !== null) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        sph.radius = Math.max(3, Math.min(20, sph.radius - (d - pinchDist) * 0.018));
        pinchDist  = d;
      }
    }, { passive: true });

    canvas.addEventListener('click', e => {
      if (dragMoved) return; // suppress click after drag

      // Raycast against all non-popping orbit + float hearts
      _pickMouse.set(
        (e.clientX / window.innerWidth)  * 2 - 1,
       -(e.clientY / window.innerHeight) * 2 + 1
      );
      _pickRay.setFromCamera(_pickMouse, camera);

      const targets = [...orbitHearts, ...floatHearts, ...starPool];
      const hits = _pickRay.intersectObjects(targets, false);

      if (hits.length > 0) {
        const hitMesh = hits[0].object;

        if (hitMesh.userData.isStar) {
          // ── STAR CLICK ──────────────────────────────────────
          const si = starPool.indexOf(hitMesh);
          if (si !== -1) starPool.splice(si, 1);
          scene.remove(hitMesh);
          hitMesh.material.dispose();
          spawnBurst(hitMesh.position.clone());
          shockTime = clock.getElapsedTime();
          showQuote(STAR_QUOTES);
          bloomTarget = 5.2;
          setTimeout(() => { bloomTarget = 1.3; }, 800);
          showComboMsg('★ Wish Granted', true);
        } else {
          // ── HEART CLICK ─────────────────────────────────────
          const isSpecial = hitMesh.userData.isSpecial;
          const chainPos  = hitMesh.position.clone();
          if (isSpecial) {
            unmarkSpecial(true);
            popSpecialChain(chainPos);
          }
          popHeart(hitMesh);
          showQuote();
          incrementLoveCounter();
          const c = registerPop();
          if (!isSpecial) {
            bloomTarget = c >= 5 ? 4.2 : c >= 3 ? 3.4 : 2.8;
            setTimeout(() => { bloomTarget = 1.3; }, 400);
          }
        }
      } else {
        spawnBurst();
        shockTime = clock.getElapsedTime();
      }
    });

    canvas.addEventListener('touchend', e => {
      if (e.touches.length < 2) pinchDist = null;
      e.preventDefault();
    }, { passive: false });

    // ── MAIN LOOP ────────────────────────────────────────────
    const clock = new THREE.Clock();
    const _tmp = new THREE.Vector3();

    function tick() {
      requestAnimationFrame(tick);
      const t = clock.getElapsedTime();

      if (!isDragging) {
        thetaInertia *= 0.94;
        autoTheta    += 0.0025 + thetaInertia;
        sph.theta     = autoTheta;
        phiOffset    *= 0.982;
        sph.phi = Math.max(0.08, Math.min(Math.PI - 0.08,
          Math.PI / 2 + Math.sin(t * 0.07) * 0.18 + phiOffset));
      }
      applyCamera();
      refreshCursorWorld();

      bloom.strength += (bloomTarget - bloom.strength) * 0.09;

      // ── MAIN HEART ────────────────────────────────────────
      mainHeart.rotation.y = t * 0.20 + Math.sin(t * 0.22) * 0.30;
      mainHeart.rotation.x = Math.sin(t * 0.16) * 0.11;
      const beat  = 1 + Math.sin(t * 1.3) * 0.036;
      const shock0 = applyShock(_tmp.set(0,0,0), t);
      const ms = mainHeart.userData.baseScale * beat * (1 + shock0);
      mainHeart.scale.setScalar(ms);
      glowShell.scale.setScalar(ms * 1.04);
      glowShell.material.opacity = 0.045 + shock0 * 0.18 + Math.sin(t*1.3)*0.015;

      MAT_MAIN.color.lerp(themeMainCol, 0.03);
      MAT_MAIN.emissive.lerp(themeMainEmi, 0.03);

      // ── ORBIT HEARTS ──────────────────────────────────────
      for (const m of orbitHearts) {
        const d = m.userData;
        d.angle += d.speed * 0.016;

        _tmp.set(Math.cos(d.angle) * d.r, 0, Math.sin(d.angle) * d.r * 0.6);
        _tmp.applyAxisAngle(d.tax, d.ta);
        _tmp.y += d.yo + Math.sin(t * 0.52 + d.ph) * 0.42;
        m.position.copy(_tmp);

        m.rotation.y = -d.angle + Math.PI;
        m.rotation.x = Math.sin(t * 0.25 + d.ph) * 0.22;
        m.rotation.z = Math.cos(t * 0.18 + d.ph) * 0.14;

        const sk = applyShock(m.position, t);
        m.scale.setScalar(d.sz * (1 + sk));

        if (d.tCol) m.material.color.lerp(d.tCol, 0.03);
        if (d.tEmi) m.material.emissive.lerp(d.tEmi, 0.03);

        if (!m.userData.isSpecial) {
          const cd  = m.position.distanceTo(cursorWorld);
          const tEI = d.baseEI + (cd < 2.5 ? (1 - cd / 2.5) * 1.4 : 0);
          m.material.emissiveIntensity += (tEI - m.material.emissiveIntensity) * 0.10;
        }
      }

      // ── SPECIAL HEART PULSE & SPARKLES ───────────────────
      if (specialMesh) {
        if (specialMesh.userData._popping) {
          unmarkSpecial(false);
        } else {
          const age = t - specialSpawnedAt;
          if (age > SPECIAL_DURATION) {
            unmarkSpecial(false);
            nextSpecialAt = t + 20 + Math.random() * 22;
          } else {
            const pulse = Math.sin(t * 5.2);
            specialMesh.material.color.lerp(GOLD_COL, 0.06);
            specialMesh.material.emissive.lerp(GOLD_EMI, 0.06);
            specialMesh.material.emissiveIntensity = 1.8 + pulse * 0.8;
            specialMesh.scale.setScalar(specialMesh.userData.sz * (1.14 + pulse * 0.07));
            if (specialGlow) {
              specialGlow.position.copy(specialMesh.position);
              specialGlow.material.opacity = 0.10 + pulse * 0.06;
              specialGlow.scale.setScalar(specialMesh.userData.sz * 1.6);
            }
            // Orbit sparkles
            const n = specialSparkles.length;
            for (let i = 0; i < n; i++) {
              const ang = (i / n) * Math.PI * 2 + t * 2.8;
              const r2  = specialMesh.userData.sz * 0.95;
              specialSparkles[i].position.set(
                specialMesh.position.x + Math.cos(ang) * r2,
                specialMesh.position.y + Math.sin(ang * 0.6 + t) * r2 * 0.55,
                specialMesh.position.z + Math.sin(ang) * r2 * 0.5
              );
              specialSparkles[i].rotation.y += 0.15;
              specialSparkles[i].material.opacity = 0.55 + Math.sin(t * 9 + i * 1.1) * 0.35;
            }
          }
        }
      } else if (t > nextSpecialAt && orbitHearts.length > 0) {
        markSpecial();
      }

      // ── FLOAT HEARTS ──────────────────────────────────────
      for (let i = 0; i < floatHearts.length; i++) {
        const m = floatHearts[i];
        const d = m.userData;

        m.rotation.y += d.rotY;
        m.rotation.x += d.rotX;

        m.position.y += Math.sin(t * 0.38 + d.phase + i * 0.28) * 0.003;
        m.position.x += Math.cos(t * 0.29 + d.phase + i * 0.44) * 0.002;

        const toMouse = _tmp.copy(cursorWorld).sub(m.position);
        const md = toMouse.length();
        if (md < 5.5 && md > 0.05) {
          m.position.addScaledVector(toMouse.normalize(), (1 - md / 5.5) * 0.007);
        }
        _tmp.copy(d.home).sub(m.position);
        m.position.addScaledVector(_tmp, 0.006);

        const sk = applyShock(m.position, t);
        if (sk > 0) {
          _tmp.copy(m.position).normalize().multiplyScalar(sk * 0.55);
          m.position.add(_tmp);
        }

        if (d.tCol) m.material.color.lerp(d.tCol, 0.03);
        if (d.tEmi) m.material.emissive.lerp(d.tEmi, 0.03);

        const cd = m.position.distanceTo(cursorWorld);
        const tEI = d.baseEI + (cd < 2.0 ? (1 - cd / 2.0) * 1.6 : 0);
        m.material.emissiveIntensity += (tEI - m.material.emissiveIntensity) * 0.10;
      }

      // ── POPPING HEARTS ────────────────────────────────────
      for (let i = poppingPool.length - 1; i >= 0; i--) {
        const p = poppingPool[i];
        p.life -= 0.032;
        // Scale pops up sharply then we fade — gives a "burst" feel
        const popScale = p.originScale * (1 + (1 - p.life) * 1.6);
        p.mesh.scale.setScalar(popScale);
        p.mesh.material.opacity = Math.max(0, p.life * p.life);
        p.mesh.material.emissiveIntensity = p.life * 2.8;
        p.mesh.rotation.y += 0.12;
        p.mesh.rotation.z += 0.06;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          p.mesh.material.dispose();
          poppingPool.splice(i, 1);
        }
      }

      // ── BURST HEARTS ──────────────────────────────────────
      for (let i = burstPool.length - 1; i >= 0; i--) {
        const h = burstPool[i]; const d = h.userData;
        d.vy += d.grav;
        h.position.x += d.vx; h.position.y += d.vy; h.position.z += d.vz;
        h.rotation.y += d.rotY; h.rotation.z += d.rotZ;
        d.life -= d.decay;
        h.material.opacity = Math.max(0, d.life);
        h.material.emissiveIntensity = d.life * 2.5;
        if (d.life <= 0) { scene.remove(h); burstPool.splice(i, 1); }
      }

      // ── CURSOR TRAIL ──────────────────────────────────────
      trailTick++;
      if (trailTick % 4 === 0 && cursorWorld.distanceTo(lastTrailPos) > 0.18) {
        spawnTrailHeart(cursorWorld.clone());
        lastTrailPos.copy(cursorWorld);
      }
      for (let i = trailPool.length - 1; i >= 0; i--) {
        const h = trailPool[i]; const d = h.userData;
        d.life -= d.decay;
        if (d.isSpark) {
          h.position.y += d.vy;
          h.material.opacity = Math.max(0, d.life * d.life);
        } else {
          h.position.y += d.vy;
          h.position.x += d.vx;
          h.rotation.y += d.rotY;
          h.material.opacity = Math.max(0, d.life * d.life);
          h.material.emissiveIntensity = d.life * 2.2;
          h.scale.setScalar(d.baseSc * (0.4 + d.life * 0.6));
        }
        if (d.life <= 0) { scene.remove(h); h.material.dispose(); trailPool.splice(i, 1); }
      }

      // ── SHOOTING STARS ────────────────────────────────────
      if (t > nextStarAt) {
        spawnShootingStar();
        nextStarAt = t + 7 + Math.random() * 14;
      }
      for (let i = starPool.length - 1; i >= 0; i--) {
        const h = starPool[i]; const d = h.userData;
        h.position.x += d.vx;
        h.position.y += d.vy;
        h.rotation.z += d.rotZ;
        h.rotation.y += 0.06;
        d.trailT++;
        if (d.trailT % 2 === 0) spawnStarTrail(h.position.clone());
        d.life -= d.decay;
        h.material.opacity = Math.min(1, d.life * 5);
        if (d.life <= 0 || Math.abs(h.position.x) > 19) {
          scene.remove(h); h.material.dispose(); starPool.splice(i, 1);
        }
      }

      // ── PARTICLES ─────────────────────────────────────────
      cloud.rotation.y = t * 0.022;
      cloud.rotation.x = t * 0.009;

      // ── DYNAMIC LIGHTS ────────────────────────────────────
      for (const { l, r, s, yo, ph } of DL) {
        l.position.set(
          Math.cos(t * s + ph) * r,
          yo + Math.sin(t * s * 0.65 + ph) * 1.8,
          Math.sin(t * s + ph) * r
        );
      }

      composer.render();
    }

    tick();

    // ── RESIZE ──────────────────────────────────────────────
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });
  </script>
</body>
</html>
